<!doctype html>
<meta charset="utf-8">
<title>CKPD - slozeni dle nacrtu</title>
<style>
  body { margin: 0; font-family: system-ui; background: #f4f4f8; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 16px; }
  .cell { background: #fff; padding: 18px; text-align: center; }
  .cell.navy { background: #000064; }
  .cell img { width: 100%; height: auto; }
  .cell p { margin: 8px 0 0; font-size: 11px; color: #555; }
  .cell.navy p { color: #B6B3FF; }
</style>
<div class="grid">
  <div class="cell"><img src="ckpd-logo-slozeny-blue.svg"><p>blue</p></div>
  <div class="cell navy"><img src="ckpd-logo-slozeny-blue.svg" style="filter:brightness(0) invert(1)"><p>negativ na navy</p></div>
  <div class="cell"><img src="ckpd-logo-slozeny-navy-blue.svg"><p>navy + blue zamerovac</p></div>
  <div class="cell"><img src="ckpd-logo-slozeny-navy-fialova.svg"><p>navy + fialovy zamerovac</p></div>
</div>
