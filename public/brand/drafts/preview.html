<!doctype html>
<meta charset="utf-8">
<title>ČKPD — složené logo + zářez Č</title>
<style>
  body { margin: 0; font-family: system-ui; background: #f4f4f8; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; padding: 16px; }
  .cell { background: #fff; padding: 18px; text-align: center; }
  .cell.navy { background: #000064; }
  .cell.wide { grid-column: span 2; }
  .cell img { width: 100%; max-width: 300px; height: auto; }
  .cell p { margin: 8px 0 0; font-size: 11px; color: #555; }
  .cell.navy p { color: #B6B3FF; }
</style>
<div class="grid">
  <div class="cell"><img src="ckpd-logo-slozeny-blue.svg"><p>složené — blue, zaměřovač 0.38</p></div>
  <div class="cell"><img src="ckpd-logo-slozeny-blue-vetsi.svg"><p>složené — blue, zaměřovač 0.44</p></div>
  <div class="cell"><img src="ckpd-logo-slozeny-navy-blue.svg"><p>navy + blue akcent</p></div>
  <div class="cell navy"><img src="ckpd-logo-slozeny-blue.svg" style="filter:brightness(0) invert(1)"><p>negativ na navy</p></div>
  <div class="cell"><img src="ckpd-logo-slozeny-navy-fialova.svg"><p>navy + fialová (původní barvy)</p></div>
  <div class="cell wide"><img src="ckpd-wordmark-n1-skoda.svg" style="max-width:420px"><p>n1 — zářez 22 % šířky, hloubka 12 %</p></div>
  <div class="cell wide navy"><img src="ckpd-wordmark-n1-skoda.svg" style="max-width:420px; filter:brightness(0) invert(1)"><p>n1 na navy</p></div>
  <div class="cell wide"><img src="ckpd-wordmark-n2-hlubsi.svg" style="max-width:420px"><p>n2 — hlubší 16 %</p></div>
  <div class="cell wide"><img src="ckpd-wordmark-n3-uzsi.svg" style="max-width:420px"><p>n3 — užší 16 % šířky</p></div>
</div>
